<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clear Dream Energy Save</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        background: #07090f;
        color: #dbeafe;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 50% 20%, rgba(96, 165, 250, 0.22), transparent 32rem),
          linear-gradient(180deg, #101827 0%, #07090f 100%);
      }

      main {
        width: min(520px, calc(100vw - 32px));
        padding: 28px;
        border: 1px solid rgba(147, 197, 253, 0.35);
        border-radius: 10px;
        background: rgba(7, 12, 22, 0.88);
        box-shadow:
          0 18px 60px rgba(0, 0, 0, 0.38),
          inset 0 0 28px rgba(96, 165, 250, 0.08);
      }

      h1 {
        margin: 0 0 14px;
        font-size: 1.35rem;
        letter-spacing: 0;
      }

      p {
        margin: 10px 0;
        line-height: 1.7;
        color: #bfdbfe;
      }

      .status {
        margin-top: 18px;
        padding: 12px 14px;
        border: 1px solid rgba(125, 211, 252, 0.4);
        border-radius: 8px;
        color: #e0f2fe;
        background: rgba(14, 116, 144, 0.18);
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 40px;
        padding: 0 16px;
        border: 1px solid rgba(147, 197, 253, 0.52);
        border-radius: 8px;
        color: #eff6ff;
        text-decoration: none;
        background: rgba(37, 99, 235, 0.26);
        font: inherit;
        cursor: pointer;
      }

      a:hover,
      button:hover:not(:disabled) {
        background: rgba(37, 99, 235, 0.38);
      }

      button {
        border-color: rgba(248, 113, 113, 0.62);
        background: rgba(185, 28, 28, 0.28);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.42;
      }

      input {
        box-sizing: border-box;
        width: 100%;
        min-height: 40px;
        margin-top: 12px;
        padding: 0 12px;
        border: 1px solid rgba(147, 197, 253, 0.4);
        border-radius: 8px;
        color: #eff6ff;
        background: rgba(15, 23, 42, 0.9);
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>清理本地存档</h1>
      <p>此操作会永久删除当前来源下的主存档和所有滚动备份。</p>
      <p>仅在坏档导致主页面无法打开时使用。输入 DELETE 后才能执行。</p>
      <input id="confirmation" autocomplete="off" placeholder="DELETE" />
      <div class="status" id="status">尚未清理任何数据。</div>
      <div class="actions">
        <button id="clear" type="button" disabled>永久删除存档</button>
        <a href="/Dream-Energy-Incremental/">返回游戏</a>
      </div>
    </main>

    <script>
      const saveKey = "dream-energy-incremental-save";
      const backupsKey = "dream-energy-incremental-save-backups";
      const confirmation = document.getElementById("confirmation");
      const clearButton = document.getElementById("clear");
      const status = document.getElementById("status");

      confirmation.addEventListener("input", () => {
        clearButton.disabled = confirmation.value !== "DELETE";
      });

      clearButton.addEventListener("click", () => {
        if (confirmation.value !== "DELETE") return;
        const hadSave = localStorage.getItem(saveKey) !== null;
        const hadBackups = localStorage.getItem(backupsKey) !== null;
        localStorage.removeItem(saveKey);
        localStorage.removeItem(backupsKey);
        clearButton.disabled = true;
        confirmation.disabled = true;
        status.textContent = hadSave || hadBackups
          ? "主存档和滚动备份已永久删除。"
          : "没有找到可删除的本地存档。";
      });
    </script>
  </body>
</html>
